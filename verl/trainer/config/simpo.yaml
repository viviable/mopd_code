defaults:
  - ppo_trainer
  - user
  - _self_

# MAX_PROMPT_LENGTH=2048
# MAX_RESPONSE_LENGTH=8192
# MAX_MODEL_LEN=$((MAX_PROMPT_LENGTH + MAX_RESPONSE_LENGTH))
max_model_len: 10240

actor_rollout_ref:
  actor:
    # ppo_mini_batch_size is multiplied by rollout.n internally, so 32 -> 256 on a
    # single GPU (== train_batch_size * n == full rollout batch, one optimizer step).
    ppo_mini_batch_size: 32
    # One full rollout group (n samples) per micro-batch. Preference pairs are formed
    # strictly within a group, so a group-sized micro-batch captures every intended
    # pair while keeping memory low. Requires balance_batch=False + interleaved rollout.
    ppo_micro_batch_size_per_gpu: 8
    use_dynamic_bsz: False
    # SimPO is reference-free (no reference model needed).
    use_kl_loss: False
    entropy_coeff: 0.0
    policy_loss:
      loss_mode: simpo
      simpo_beta: 2.0
      simpo_gamma: 1.0
      pref_label_smoothing: 0.0
    optim:
      lr: 1e-6
  rollout:
    n: 8
    calculate_log_probs: True

algorithm:
  # GRPO advantages are computed but unused by the SimPO loss path; kept so the rest of
  # the pipeline (token_level_rewards etc.) is unchanged and the budget stays matched.
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: False

data:
  train_batch_size: 32

trainer:
  val_before_train: True
  # Keep rollout groups contiguous so each micro-batch is one intact group.
  balance_batch: False
